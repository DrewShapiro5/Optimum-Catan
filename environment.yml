name: catanatron
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - nodejs=24
  - pip
  - pip:
      # Core Catanatron engine, WebUI backend, and local agent_apis package
      - -e ./framework[web]
      - -e .
      # Training, ONNX export, schemas, and tests
      - numpy
      - gymnasium==0.29.1
      - onnx
      - jsonschema
      - pytest
      # PyTorch: macOS uses the standard PyPI wheel (MPS).
      # On Windows with an NVIDIA GPU, install the CUDA wheel after creating the env:
      #   pip install --upgrade --force-reinstall torch --index-url https://download.pytorch.org/whl/cu126
      - torch
      # ONNX Runtime GPU (provides onnxruntime.dll + CUDAExecutionProvider on Windows/Linux;
      # pinned to 1.22.0 to match ort 2.0.0-rc.10 and CUDA 12 / cublasLt64_12.dll,
      # since 1.24+ switched to CUDA 13 / cublasLt64_13.dll).
      - onnxruntime-gpu==1.22.0; sys_platform != "darwin"
